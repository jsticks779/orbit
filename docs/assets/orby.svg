<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" width="120" height="120" role="img" aria-label="Orby, the Orbit mascot">
  <style>
    .bob { animation: bob 3.2s ease-in-out infinite; transform-origin: 60px 64px; }
    .eye { animation: blink 4.6s infinite; transform-box: fill-box; transform-origin: center; }
    @keyframes bob { 0%, 100% { transform: translateY(0) rotate(0deg); } 50% { transform: translateY(-5px) rotate(-3deg); } }
    @keyframes blink { 0%, 92%, 100% { transform: scaleY(1); } 95% { transform: scaleY(0.12); } }
    @media (prefers-reduced-motion: reduce) { .bob, .eye { animation: none; } }
  </style>
  <g class="bob">
    <g transform="rotate(-16 60 64)">
      <!-- back half of the ring -->
      <path d="M8 64 A52 15 0 0 1 112 64" fill="none" stroke="#FFD60A" stroke-width="5" stroke-linecap="round"/>
    </g>
    <!-- planet -->
    <circle cx="60" cy="62" r="31" fill="#0A0A0A"/>
    <path d="M40 48 A26 26 0 0 1 56 36" fill="none" stroke="#fff" stroke-opacity=".18" stroke-width="4" stroke-linecap="round"/>
    <ellipse class="eye" cx="50.5" cy="61" rx="4.2" ry="5.8" fill="#fff"/>
    <ellipse class="eye" cx="69.5" cy="61" rx="4.2" ry="5.8" fill="#fff"/>
    <g transform="rotate(-16 60 64)">
      <!-- front half of the ring -->
      <path d="M8 64 A52 15 0 0 0 112 64" fill="none" stroke="#FFD60A" stroke-width="5" stroke-linecap="round"/>
      <!-- a little file in orbit -->
      <g>
        <path d="M-6 -8 h7 l5 5 v11 a1.5 1.5 0 0 1 -1.5 1.5 h-10.5 a1.5 1.5 0 0 1 -1.5 -1.5 v-14.5 a1.5 1.5 0 0 1 1.5 -1.5z" fill="#fff" stroke="#0A0A0A" stroke-width="2" stroke-linejoin="round"/>
        <path d="M1 -8 v5 h5" fill="none" stroke="#0A0A0A" stroke-width="2" stroke-linejoin="round"/>
        <animateMotion dur="6s" repeatCount="indefinite" path="M112 64 A52 15 0 1 1 8 64 A52 15 0 1 1 112 64"/>
      </g>
    </g>
  </g>
</svg>
