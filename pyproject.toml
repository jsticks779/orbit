[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "orbit"
version = "0.1.5"
description = "Convert and edit files with a drag + Shift. A radial file tool for Linux."
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.10"
authors = [{ name = "jsticks779" }]
dependencies = [
  "Pillow>=10",
  "pymupdf>=1.24",
  "evdev>=1.7",
]

[project.optional-dependencies]
full = ["pdf2docx>=0.5", "pillow-heif>=0.18"]
dev = ["pytest>=8"]

[project.scripts]
orbit = "orbit.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
orbit = ["ui/*.css", "sounds/*.wav", "fonts/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
